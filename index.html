<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Latein Vokabeltrainer</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <!-- LOGIN SEITE -->
    <div id="loginPage">

        <div class="topbar">
            <button id="themeButton">🌙</button>
        </div>

        <div class="loginBox">

            <h1>Latein Vokabeltrainer</h1>

            <input 
                id="username"
                type="text"
                placeholder="Benutzername"
            >

            <input 
                id="password"
                type="password"
                placeholder="Passwort"
            >

            <button id="loginButton">
                Anmelden
            </button>

            <p id="loginMessage"></p>

        </div>

    </div>



    <!-- TRAINER (erst nach Login sichtbar) -->
    <div id="trainerPage" style="display:none;">

        <div class="topbar">
            <button id="themeButtonTrainer">🌙</button>
        </div>


        <div class="trainer">

            <h1>Latein Vokabeltrainer</h1>

            <div id="vocabulary">
                <!-- Hier kommt dein bestehender Trainer rein -->
            </div>

        </div>

    </div>



<script>

let darkMode = false;


// Dark / Light Mode
document.getElementById("themeButton").onclick = function(){

    darkMode = !darkMode;

    document.body.classList.toggle("dark");

    this.textContent = darkMode ? "☀️" : "🌙";

};


// Test Login (später Supabase)
document.getElementById("loginButton").onclick = function(){

    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;


    if(username === "admin" && password === "1234"){

        document.getElementById("loginPage").style.display="none";
        document.getElementById("trainerPage").style.display="block";

    }

    else{

        document.getElementById("loginMessage").textContent =
        "Falscher Benutzername oder falsches Passwort";

    }

};


</script>


</body>
</html>
