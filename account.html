<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account - Latein Vokabeltrainer</title>

<link rel="stylesheet" href="style.css">

<link rel="icon" href="icon.png" type="image/png">

</head>


<body>


<div class="container">


    <div class="screen active card">


        <!-- Top Buttons -->

        <div class="top-controls">

            <button
                class="icon-toggle-btn"
                onclick="window.location.href='trainer.html'"
                title="Zurück zum Trainer">
                🏛️
            </button>


            <button
                id="themeButton"
                class="icon-toggle-btn"
                onclick="toggleTheme()"
                title="Design wechseln">
                🌗
            </button>

        </div>



        <h1>
            👤 Account
        </h1>



        <div class="account-info">


            <h2>📧 E-Mail</h2>

            <p id="email">
                Wird geladen...
            </p>



            <h2>🔐 Rolle</h2>

            <p id="role">
                Wird geladen...
            </p>



            <h2>✅ Status</h2>

            <p id="approved">
                Wird geladen...
            </p>



            <button
                class="main-btn"
                id="logoutBtn">
                🚪 Logout
            </button>


        </div>


    </div>


</div>



<script type="module">

import {

    auth,
    db,
    doc,
    getDoc

} from "./firebase.js";


import {

    onAuthStateChanged,
    signOut

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";




// Nutzer laden

onAuthStateChanged(auth, async (user)=>{


    if(!user){

        window.location.href="index.html";
        return;

    }



    document.getElementById("email").textContent =
    user.email;



    const userDoc =
    await getDoc(
        doc(db,"users",user.uid)
    );



    if(userDoc.exists()){


        const data =
        userDoc.data();



        document.getElementById("role").textContent =
        data.role;



        document.getElementById("approved").textContent =

        data.approved
        ? "✅ Freigeschaltet"
        : "❌ Nicht freigeschaltet";


    }



});




// Logout

document
.getElementById("logoutBtn")
.addEventListener("click", async ()=>{


    await signOut(auth);


    window.location.href="index.html";


});



</script>



<script type="module" src="page-auth.js"></script>


<script>


function toggleTheme(){


    const button =
    document.getElementById("themeButton");



    if(document.documentElement.getAttribute("data-theme")==="dark"){


        document.documentElement.removeAttribute("data-theme");

        localStorage.setItem("theme","light");

        button.textContent="🌗";


    } else {


        document.documentElement.setAttribute("data-theme","dark");

        localStorage.setItem("theme","dark");

        button.textContent="🌓";


    }


}



window.onload=function(){


    const button =
    document.getElementById("themeButton");



    if(localStorage.getItem("theme")==="dark"){


        document.documentElement.setAttribute("data-theme","dark");

        button.textContent="🌓";


    }


};

</script>


</body>

</html>
