<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account - Latein Vokabeltrainer</title>

<link rel="stylesheet" href="account.css">
<link rel="icon" href="icon.png" type="image/png">

</head>


<body>


<script type="module" src="page-auth.js"></script>



<div class="container">

<div class="screen active card">


<!-- Home Button -->

<button
class="icon-toggle-btn home-button"
onclick="goTrainer()"
title="Trainer">
🏛️
</button>




<!-- Rechte Buttons -->

<div class="top-controls">


<button
class="icon-toggle-btn"
id="btn-mute"
onclick="openSoundMenu(); playSound('click')"
title="Audio">
🔊
</button>



<button
id="themeButton"
class="icon-toggle-btn"
onclick="toggleTheme(); playSound('click')"
title="Design wechseln">
🌗
</button>


</div>





<h1>
👤 Account
</h1>





<div class="account-info">



<h2>📧 E-Mail</h2>

<p id="email">
Wird geladen...
</p>




<h2>🔐 Passwort</h2>


<input
id="newPassword"
type="password"
placeholder="Neues Passwort">



<button
class="main-btn"
id="changePasswordBtn">
🔑 Passwort ändern
</button>





<h2>☑ Anmeldung</h2>


<label>

<input
type="checkbox"
id="rememberMe">

7 Tage angemeldet bleiben

</label>





<h2>✅ Status</h2>

<p id="approved">
Wird geladen...
</p>





<h2>👤 Rolle</h2>

<p id="role">
Wird geladen...
</p>





<button
class="main-btn"
id="logoutBtn">
🚪 Logout
</button>




<button
class="main-btn delete-btn"
id="deleteBtn">
🗑️ Account löschen
</button>




</div>



</div>

</div>





<!-- Firebase -->

<script type="module">


import {

auth,
db,
doc,
getDoc,
deleteDoc

} from "./firebase.js";



import {

onAuthStateChanged,
signOut,
updatePassword,
deleteUser

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";





let currentUser = null;




onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="index.html";
return;

}



currentUser=user;



document.getElementById("email").textContent =
user.email;



const userDoc =
await getDoc(
doc(db,"users",user.uid)
);



if(userDoc.exists()){


const data=userDoc.data();



document.getElementById("role").textContent =
data.role;



document.getElementById("approved").textContent =

data.approved
? "✅ Freigeschaltet"
: "❌ Nicht freigeschaltet";



}



});







// Passwort ändern


document
.getElementById("changePasswordBtn")
.addEventListener("click",async()=>{


const password =
document.getElementById("newPassword").value;



if(password.length < 6){

alert("Passwort muss mindestens 6 Zeichen haben");

return;

}



try{


await updatePassword(
currentUser,
password
);


alert("Passwort geändert");


}

catch(error){

alert(error.message);

}


});







// Logout


document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{


playSound("click");


await signOut(auth);


window.location.href="index.html";


});







// Account löschen


document
.getElementById("deleteBtn")
.addEventListener("click",async()=>{


if(!confirm("Account wirklich löschen?"))
return;



try{


await deleteDoc(
doc(db,"users",currentUser.uid)
);



await deleteUser(currentUser);



window.location.href="index.html";


}


catch(error){

alert(error.message);

}


});



</script>






<script>


let soundEffectsEnabled = true;



let audioCtx =
new (window.AudioContext ||
window.webkitAudioContext)();




function playSound(type){


if(!soundEffectsEnabled)
return;



try{


const osc =
audioCtx.createOscillator();


const gainNode =
audioCtx.createGain();



osc.connect(gainNode);

gainNode.connect(audioCtx.destination);



if(type==="click"){


osc.type="sine";

osc.frequency.setValueAtTime(
800,
audioCtx.currentTime
);


gainNode.gain.setValueAtTime(
0.12,
audioCtx.currentTime
);


gainNode.gain.exponentialRampToValueAtTime(
0.01,
audioCtx.currentTime+0.08
);


osc.start();

osc.stop(
audioCtx.currentTime+0.08
);


}


}

catch(e){}



}






function openSoundMenu(){

const menu =
document.getElementById("sound-menu");


if(menu){

menu.style.display =
menu.style.display==="none"
?"block"
:"none";

}

}





function toggleTheme(){


if(
document.documentElement.getAttribute("data-theme")
==="dark"
){


document.documentElement.removeAttribute("data-theme");

localStorage.setItem("theme","light");


}

else{


document.documentElement.setAttribute("data-theme","dark");

localStorage.setItem("theme","dark");


}


updateThemeButton();


}





function updateThemeButton(){


const button =
document.getElementById("themeButton");

if(!button)
return;



if(
document.documentElement.getAttribute("data-theme")
==="dark"
){

button.textContent="🌓";

}

else{

button.textContent="🌗";

}


}






function goTrainer(){

playSound("click");


setTimeout(()=>{

window.location.href="trainer.html";

},150);


}





window.onload=()=>{


if(localStorage.getItem("theme")==="dark"){

document.documentElement.setAttribute(
"data-theme",
"dark"
);

}


updateThemeButton();


};


</script>



</body>

</html>
