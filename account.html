<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Account - Latein Vokabeltrainer</title>

<link rel="stylesheet" href="account.css">
<link rel="icon" href="icon.png" type="image/png">

</head>


<body>


<script type="module" src="page-auth.js"></script>


<div class="container">

<div class="screen active card">


<!-- Home -->

<button
class="icon-toggle-btn home-button"
onclick="goTrainer()"
title="Trainer">
🏛️
</button>



<!-- Rechts -->

<div class="top-controls">


<button
class="icon-toggle-btn"
id="btn-mute"
onclick="openSoundMenu()"
title="Audio">
🔊
</button>



<button
id="themeButton"
class="icon-toggle-btn"
onclick="toggleTheme()"
title="Design wechseln">
🌗
</button>


</div>



<h1>
👤 Account
</h1>



<div class="account-info">



<h2>📧 E-Mail</h2>

<p id="email">
Wird geladen...
</p>



<h2>🔐 Passwort</h2>

<input
id="newPassword"
type="password"
placeholder="Neues Passwort">


<button
class="main-btn"
id="changePasswordBtn"
onclick="playSound('click')">
🔑 Passwort ändern
</button>




<h2>☑ Anmeldung</h2>


<label>

<input
type="checkbox"
id="rememberMe">

7 Tage angemeldet bleiben

</label>




<h2>✅ Status</h2>

<p id="approved">
Wird geladen...
</p>




<h2>👤 Rolle</h2>

<p id="role">
Wird geladen...
</p>





<button
class="main-btn"
id="logoutBtn"
onclick="playSound('click')">
🚪 Logout
</button>




<button
class="main-btn delete-btn"
id="deleteBtn"
onclick="playSound('click')">
🗑️ Account löschen
</button>



</div>


</div>

</div>






<script type="module">


import {

auth,
db,
doc,
getDoc,
deleteDoc

} from "./firebase.js";


import {

onAuthStateChanged,
signOut,
updatePassword,
deleteUser

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";




let currentUser;



onAuthStateChanged(auth, async(user)=>{


if(!user){

window.location.href="index.html";

return;

}


currentUser=user;



document
.getElementById("email")
.textContent=user.email;



const snap =
await getDoc(
doc(db,"users",user.uid)
);



if(snap.exists()){


const data=snap.data();


document
.getElementById("role")
.textContent=data.role;



document
.getElementById("approved")
.textContent =
data.approved
? "✅ Freigeschaltet"
: "❌ Nicht freigeschaltet";


}


});







// Passwort ändern


document
.getElementById("changePasswordBtn")
.addEventListener("click",async()=>{


const password =
document.getElementById("newPassword").value;



if(password.length < 6){

alert("Mindestens 6 Zeichen!");
return;

}



try{


await updatePassword(
currentUser,
password
);


alert("Passwort geändert");


}

catch(error){

alert(error.message);

}



});






// Logout


document
.getElementById("logoutBtn")
.addEventListener("click",async()=>{


await signOut(auth);


window.location.href="index.html";


});







// Löschen


document
.getElementById("deleteBtn")
.addEventListener("click",async()=>{


if(!confirm("Account wirklich löschen?"))
return;



try{


await deleteDoc(
doc(db,"users",currentUser.uid)
);



await deleteUser(currentUser);



window.location.href="index.html";


}

catch(error){

alert(error.message);

}



});



</script>





<script>


function goTrainer(){

playSound("click");


setTimeout(()=>{

window.location.href="trainer.html";

},200);


}







let soundEffectsEnabled=true;



function playSound(type){


if(type!=="click") return;



const audioCtx =
new AudioContext();



const osc =
audioCtx.createOscillator();



const gain =
audioCtx.createGain();



osc.connect(gain);

gain.connect(audioCtx.destination);



osc.frequency.value=800;

gain.gain.value=0.12;


gain.gain.exponentialRampToValueAtTime(
0.01,
audioCtx.currentTime+0.2
);


osc.start();

osc.stop(
audioCtx.currentTime+0.2
);



}





function openSoundMenu(){

alert("Soundmenü kommt als nächstes");

}







function toggleTheme(){


const button =
document.getElementById("themeButton");



if(
document.documentElement.getAttribute("data-theme")
==="dark"
){


document.documentElement.removeAttribute("data-theme");

localStorage.setItem("theme","light");

button.textContent="🌗";


}else{


document.documentElement.setAttribute("data-theme","dark");

localStorage.setItem("theme","dark");

button.textContent="🌓";


}


}





window.onload=()=>{


const button =
document.getElementById("themeButton");



if(localStorage.getItem("theme")==="dark"){


document.documentElement.setAttribute("data-theme","dark");

button.textContent="🌓";


}


};



</script>



</body>

</html>
